name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Jobs opt into OIDC or write access only when needed.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify package version matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Tag: $TAG  package.json: $PKG_VER"
          if [ "$PKG_VER" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VER) does not match tag ($TAG)"
            exit 1
          fi

  publish-npm:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing / provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Show publish tool versions
        run: |
          node --version
          npm --version

      - name: Check existing npm version
        id: npm-version
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VERSION already exists on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm-version.outputs.exists != 'true'
        run: npm ci --legacy-peer-deps

      - name: Security audit
        if: steps.npm-version.outputs.exists != 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        if: steps.npm-version.outputs.exists != 'true'
        run: npm run check:ts

      - name: Pack dry run
        if: steps.npm-version.outputs.exists != 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish --access public --provenance

  create-github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub release
    steps:
      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          Release $GITHUB_REF_NAME.

          npm: https://www.npmjs.com/package/@sting8k/pi-srcwalk/v/$VERSION
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
